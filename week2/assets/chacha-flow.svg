<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-labelledby="title desc"><title id="title">ChaCha20 encryption and decryption</title><desc id="desc">The key, nonce and block counter generate a keystream. XOR with that stream encrypts plaintext or decrypts ciphertext.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#572b68"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" font-size="18" fill="#25232b"><rect x="35" y="20" width="240" height="62" rx="5" fill="#f5eff7" stroke="#572b68" stroke-width="1.5"/><text x="155.0" y="48.0" text-anchor="middle">Secret key</text><text x="155.0" y="71.0" font-size="15" text-anchor="middle">32 bytes</text><rect x="330" y="20" width="240" height="62" rx="5" fill="#f5eff7" stroke="#572b68" stroke-width="1.5"/><text x="450.0" y="48.0" text-anchor="middle">Public nonce</text><text x="450.0" y="71.0" font-size="15" text-anchor="middle">12 bytes</text><rect x="625" y="20" width="240" height="62" rx="5" fill="#f5eff7" stroke="#572b68" stroke-width="1.5"/><text x="745.0" y="48.0" text-anchor="middle">Block counter</text><text x="745.0" y="71.0" font-size="15" text-anchor="middle">Advances within the message</text><rect x="270" y="124" width="360" height="70" rx="5" fill="#f5eff7" stroke="#572b68" stroke-width="1.5"/><text x="450.0" y="156.0" text-anchor="middle">ChaCha20 block function</text><text x="450.0" y="179.0" font-size="15" text-anchor="middle">ARX mixing, 20 rounds</text><path d="M155 82 V106 H325 V124" stroke="#572b68" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M450 82 V124" stroke="#572b68" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M745 82 V106 H575 V124" stroke="#572b68" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="330" y="225" width="240" height="50" rx="5" fill="#f5eff7" stroke="#572b68" stroke-width="1.5"/><text x="450.0" y="256.0" text-anchor="middle">Keystream bytes</text><path d="M450 194 V225" stroke="#572b68" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M450 275 V290 H225 V310" stroke="#572b68" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M450 275 V290 H675 V310" stroke="#572b68" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="25" y="318" width="140" height="55" rx="5" fill="#f5eff7" stroke="#572b68" stroke-width="1.5"/><text x="95.0" y="351.5" text-anchor="middle">Plaintext</text><circle cx="225" cy="345" r="29" fill="#edf6f4" stroke="#176d70" stroke-width="2"/><text x="225" y="351" font-size="16" text-anchor="middle">XOR</text><rect x="295" y="318" width="140" height="55" rx="5" fill="#f5eff7" stroke="#572b68" stroke-width="1.5"/><text x="365.0" y="351.5" text-anchor="middle">Ciphertext</text><path d="M165 345 H195" stroke="#572b68" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M255 345 H295" stroke="#572b68" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="475" y="318" width="140" height="55" rx="5" fill="#f5eff7" stroke="#572b68" stroke-width="1.5"/><text x="545.0" y="351.5" text-anchor="middle">Ciphertext</text><circle cx="675" cy="345" r="29" fill="#edf6f4" stroke="#176d70" stroke-width="2"/><text x="675" y="351" font-size="16" text-anchor="middle">XOR</text><rect x="745" y="318" width="140" height="55" rx="5" fill="#f5eff7" stroke="#572b68" stroke-width="1.5"/><text x="815.0" y="351.5" text-anchor="middle">Plaintext</text><path d="M615 345 H645" stroke="#572b68" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M705 345 H745" stroke="#572b68" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="225" y="411" font-size="18" text-anchor="middle">Encryption</text><text x="675" y="411" font-size="18" text-anchor="middle">Decryption</text><text x="450" y="450" font-size="17" text-anchor="middle">Both ends use the same key, nonce and keystream position.</text></g></svg>